name: Verify application
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: docker build -t counting-cards:ci .
      - name: Check container and SPA routing
        run: |
          docker run -d --name counting-cards-ci -p 8080:8080 counting-cards:ci
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://localhost:8080/healthz; then break; fi
            sleep 1
          done
          curl --fail http://localhost:8080/healthz
          curl --fail http://localhost:8080/practice/sequence
      - if: always()
        run: docker logs counting-cards-ci || true
